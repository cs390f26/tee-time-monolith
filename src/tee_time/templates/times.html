<!DOCTYPE html>
<html lang="en" data-theme="club">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tee Times · Cloud Computing Country Club</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen flex flex-col bg-base-200">
    <div class="navbar bg-neutral text-neutral-content border-b-4 border-primary">
      <div class="navbar-start">
        <a href="/" class="text-lg sm:text-2xl">Cloud Computing Country Club</a>
      </div>
      <div class="navbar-end">
        <ul class="menu menu-horizontal px-1">
          <li class="menu-active"><a href="/">Tee Times</a></li>
          <li><a href="/reserved">Reserved</a></li>
          <li><a href="/members">Members</a></li>
        </ul>
      </div>
    </div>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <h1 class="text-3xl">Tee times</h1>
        <div class="join lg:join-horizontal">
          <button type="button" class="btn btn-sm join-item" id="prev-week" aria-label="Previous week">‹</button>
          <button type="button" class="btn btn-sm join-item" id="week-label"></button>
          <button type="button" class="btn btn-sm join-item" id="next-week" aria-label="Next week">›</button>
        </div>
      </div>

      <p class="text-sm mb-3" id="page-status" hidden></p>
      <div class="tabs tabs-border tabs-sm w-full week-tabs" id="week-tabs"></div>
    </main>

    <footer class="footer sm:footer-horizontal bg-neutral text-neutral-content p-4">
      <aside>
        <p>Cloud Computing Country Club · Est. 2026</p>
      </aside>
    </footer>
    <script>
      const weekLabel = document.getElementById("week-label");
      const weekTabs = document.getElementById("week-tabs");
      const pageStatus = document.getElementById("page-status");
      const weekday = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      let weekStart = startOfWeek(new Date());

      function parseDay(iso) {
        const [year, month, day] = iso.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function isoDay(day) {
        const month = String(day.getMonth() + 1).padStart(2, "0");
        const date = String(day.getDate()).padStart(2, "0");
        return day.getFullYear() + "-" + month + "-" + date;
      }

      function startOfWeek(day) {
        const monday = new Date(day.getFullYear(), day.getMonth(), day.getDate());
        monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
        return monday;
      }

      function addDays(day, count) {
        const next = new Date(day.getFullYear(), day.getMonth(), day.getDate());
        next.setDate(next.getDate() + count);
        return next;
      }

      function shortRange(start) {
        const end = addDays(start, 6);
        const startLabel = start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        const endLabel =
          start.getMonth() === end.getMonth()
            ? String(end.getDate())
            : end.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        return startLabel + "–" + endLabel;
      }

      function formatTime(value) {
        const [hourText, minute] = value.split(":");
        const hour = Number(hourText);
        const suffix = hour < 12 ? "AM" : "PM";
        const hour12 = hour % 12 || 12;
        return hour12 + ":" + minute + " " + suffix;
      }

      function dots(count) {
        const wrap = document.createElement("span");
        wrap.className = "flex gap-2";
        wrap.setAttribute("aria-hidden", "true");
        for (let i = 0; i < 4; i += 1) {
          const dot = document.createElement("span");
          dot.className =
            i < count
              ? "size-3 rounded-full bg-secondary border border-secondary"
              : "size-3 rounded-full border border-base-content/30";
          wrap.appendChild(dot);
        }
        return wrap;
      }

      function slotCard(slot) {
        const label = formatTime(slot.time) + ", " + slot.playerCount + " of 4 players";
        const card = document.createElement(slot.bookable ? "a" : "span");
        card.setAttribute("aria-label", label);
        if (slot.bookable) {
          card.href = "/book?id=" + encodeURIComponent(slot.id);
          card.className =
            "card bg-base-100 border border-base-300 hover:border-primary transition-colors no-underline";
        } else {
          card.className = "card bg-base-100 border border-base-300 opacity-45";
        }
        const body = document.createElement("span");
        body.className = "card-body items-center p-4 gap-3";
        const time = document.createElement("span");
        time.className = "slot-time text-2xl";
        time.textContent = formatTime(slot.time);
        body.append(time, dots(slot.playerCount));
        card.appendChild(body);
        return card;
      }

      function showStatus(message) {
        pageStatus.hidden = false;
        pageStatus.textContent = message;
      }

      async function loadWeek() {
        pageStatus.hidden = true;
        weekLabel.textContent = shortRange(weekStart);
        const today = isoDay(new Date());
        const days = [];
        for (let i = 0; i < 7; i += 1) {
          days.push(isoDay(addDays(weekStart, i)));
        }
        let selected = days.includes(today) ? today : days[0];
        weekTabs.replaceChildren();
        try {
          const lists = await Promise.all(
            days.map(async (iso) => {
              const response = await fetch("/tee-times?date=" + iso);
              const data = await response.json().catch(() => ({}));
              if (!response.ok) {
                throw new Error(
                  (data.error && data.error.message) || "Could not load tee times."
                );
              }
              return data.teeTimes || [];
            })
          );
          days.forEach((iso, index) => {
            const day = parseDay(iso);
            const tab = document.createElement("input");
            tab.type = "radio";
            tab.name = "tee-week";
            tab.className = "tab";
            tab.setAttribute(
              "aria-label",
              weekday[day.getDay()] + " " + day.getDate()
            );
            tab.checked = iso === selected;
            const panel = document.createElement("div");
            panel.className = "tab-content w-full pt-6";
            const heading = document.createElement("p");
            heading.className = "font-semibold mb-3";
            heading.textContent = day.toLocaleDateString("en-US", {
              weekday: "long",
              month: "long",
              day: "numeric",
            });
            const grid = document.createElement("div");
            grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3";
            const slots = lists[index];
            if (slots.length === 0) {
              const empty = document.createElement("p");
              empty.className = "text-sm text-base-content/60";
              empty.textContent = "No tee times.";
              panel.append(heading, empty);
            } else {
              for (const slot of slots) {
                grid.appendChild(slotCard(slot));
              }
              panel.append(heading, grid);
            }
            weekTabs.append(tab, panel);
          });
        } catch (error) {
          weekTabs.replaceChildren();
          showStatus(error.message);
        }
      }

      document.getElementById("prev-week").addEventListener("click", () => {
        weekStart = addDays(weekStart, -7);
        loadWeek();
      });
      document.getElementById("next-week").addEventListener("click", () => {
        weekStart = addDays(weekStart, 7);
        loadWeek();
      });
      loadWeek();
    </script>
  </body>
</html>
