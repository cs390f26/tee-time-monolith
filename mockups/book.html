<!DOCTYPE html>
<html lang="en" data-theme="club">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book · Cloud Computing Country Club</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="club.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen flex flex-col bg-base-200">
    <div class="navbar bg-neutral text-neutral-content border-b-4 border-primary">
      <div class="navbar-start">
        <a href="times.html" class="text-lg sm:text-2xl">Cloud Computing Country Club</a>
      </div>
      <div class="navbar-end">
        <ul class="menu menu-horizontal px-1">
          <li class="menu-active"><a href="times.html">Tee Times</a></li>
          <li><a href="reserved.html">Reserved</a></li>
          <li><a href="members.html">Members</a></li>
        </ul>
      </div>
    </div>

    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8">
      <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1 mb-8">
        <h1 class="text-3xl">7:00 AM</h1>
        <p class="font-semibold">Saturday, September 26</p>
      </div>

      <div class="bg-base-100 rounded-box p-6">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Players</legend>

          <div class="flex flex-col gap-3">
            <input
              type="text"
              class="input w-full bg-base-200"
              value="William Hargrove"
              readonly
              aria-label="Player 1"
            />
            <input
              type="text"
              class="input w-full bg-base-200"
              value="Margaret Ashford"
              readonly
              aria-label="Player 2"
            />
            <select class="select w-full bg-base-200" aria-label="Player 3">
              <option selected disabled>Add a member</option>
              <option>Charles Beaumont</option>
              <option>Eleanor Whitfield</option>
              <option>Thomas Langley</option>
              <option>Helen Cho</option>
            </select>
            <select class="select w-full bg-base-200" aria-label="Player 4">
              <option selected disabled>Add a member</option>
              <option>Charles Beaumont</option>
              <option>Eleanor Whitfield</option>
              <option>Thomas Langley</option>
              <option>Helen Cho</option>
            </select>
          </div>

          <p class="label">Four members per tee time.</p>
        </fieldset>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Holes</legend>
            <div role="tablist" class="tabs tabs-box w-full bg-base-200">
              <input type="radio" name="holes" class="tab flex-1" aria-label="9 holes" />
              <input type="radio" name="holes" class="tab flex-1" aria-label="18 holes" checked />
            </div>
          </fieldset>
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Cart</legend>
            <div role="tablist" class="tabs tabs-box w-full bg-base-200">
              <input type="radio" name="cart" class="tab flex-1" aria-label="Walking" checked />
              <input type="radio" name="cart" class="tab flex-1" aria-label="Cart" />
            </div>
          </fieldset>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row sm:justify-end gap-2 mt-8">
        <a href="times.html" class="btn">Cancel</a>
        <button type="button" class="btn btn-primary">Book</button>
      </div>
    </main>

    <footer class="footer sm:footer-horizontal bg-neutral text-neutral-content p-4">
      <aside>
        <p>Cloud Computing Country Club · Est. 2026</p>
      </aside>
    </footer>
  </body>
</html>
